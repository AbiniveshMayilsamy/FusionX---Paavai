version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app
    command: ["python", "backend/main.py"]
    
  frontend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - PYTHONPATH=/app
    command: ["python", "frontend/app.py"]
    
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: linkguard
      POSTGRES_PASSWORD: linkguard123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: